{{ define "main" }}
  <h1>Personal blog</h1>

  <hr>
  Welcome to my personal blog!
  {{- range .Data.Pages.GroupByDate "2006" -}}
    <ul>
    {{- range .Pages -}}
      <li>
        <a href = "{{- .RelPermalink -}}">
          {{- .Title -}}
        </a>
      </li>
    {{- end -}}
    </ul>
  {{- end -}}
  {{ .Content }}
{{ end }}
